buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// A simple Java web server for demonstration purposes when we can't run the Android app
apply plugin: 'java'
apply plugin: 'application'

mainClassName = 'com.example.vintagestore.WebServer'

dependencies {
    implementation 'com.sun.net.httpserver:http:20070405'
}

// Add a source set for the web server
sourceSets {
    main {
        java {
            srcDirs = ['server']
        }
    }
}

// Set Java compatibility for the project
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

task createWebServerFolder {
    doLast {
        new File("$projectDir/server/com/example/vintagestore").mkdirs()
    }
}

task createWebServer(dependsOn: createWebServerFolder) {
    doLast {
        new File("$projectDir/server/com/example/vintagestore/WebServer.java").text = """
package com.example.vintagestore;

import com.sun.net.httpserver.HttpExchange;
import com.sun.net.httpserver.HttpHandler;
import com.sun.net.httpserver.HttpServer;

import java.io.File;
import java.io.FileInputStream;
import java.io.IOException;
import java.io.OutputStream;
import java.net.InetSocketAddress;
import java.nio.file.Files;
import java.nio.file.Path;
import java.nio.file.Paths;
import java.util.HashMap;
import java.util.Map;

public class WebServer {
    public static void main(String[] args) throws Exception {
        HttpServer server = HttpServer.create(new InetSocketAddress("0.0.0.0", 5000), 0);
        
        // Set context for serving HTML files
        server.createContext("/", new FileHandler());
        
        server.setExecutor(null);
        server.start();
        
        System.out.println("Server started on port 5000");
        System.out.println("Visit: http://localhost:5000/");
    }
    
    static class FileHandler implements HttpHandler {
        private final Map<String, String> mimeTypes = new HashMap<>();
        
        public FileHandler() {
            mimeTypes.put("html", "text/html");
            mimeTypes.put("css", "text/css");
            mimeTypes.put("js", "application/javascript");
            mimeTypes.put("jpg", "image/jpeg");
            mimeTypes.put("jpeg", "image/jpeg");
            mimeTypes.put("png", "image/png");
            mimeTypes.put("svg", "image/svg+xml");
            mimeTypes.put("json", "application/json");
        }
        
        @Override
        public void handle(HttpExchange exchange) throws IOException {
            String requestPath = exchange.getRequestURI().getPath();
            
            // Default to index.html if root path is requested
            if (requestPath.equals("/")) {
                requestPath = "/index.html";
            }
            
            // Map the request to the app/src/main directory
            String filePath = "app/src/main" + requestPath;
            File file = new File(filePath);
            
            // If file doesn't exist, try to serve login.html
            if (!file.exists() && !requestPath.equals("/login.html")) {
                filePath = "app/src/main/login.html";
                file = new File(filePath);
            }
            
            if (file.exists()) {
                String fileExtension = getFileExtension(filePath);
                String contentType = mimeTypes.getOrDefault(fileExtension, "text/plain");
                
                // Read the file content
                byte[] fileData = Files.readAllBytes(file.toPath());
                
                // Set response headers
                exchange.getResponseHeaders().set("Content-Type", contentType);
                exchange.sendResponseHeaders(200, fileData.length);
                
                // Write the response
                try (OutputStream os = exchange.getResponseBody()) {
                    os.write(fileData);
                }
            } else {
                // File not found
                String response = "404 (Not Found)\\n";
                exchange.sendResponseHeaders(404, response.length());
                try (OutputStream os = exchange.getResponseBody()) {
                    os.write(response.getBytes());
                }
            }
        }
        
        private String getFileExtension(String filePath) {
            int lastDotIndex = filePath.lastIndexOf(".");
            if (lastDotIndex > 0) {
                return filePath.substring(lastDotIndex + 1).toLowerCase();
            }
            return "";
        }
    }
}
"""
    }
}

// Make sure the server directory and file are created before the build
compileJava.dependsOn createWebServer

task compileServer(type: JavaCompile) {
    source = 'server'
    destinationDirectory = file("$buildDir/server")
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    classpath = files()
}

task runServer(dependsOn: compileServer) {
    doLast {
        javaexec {
            classpath = files("$buildDir/server")
            mainClass = 'com.example.vintagestore.WebServer'
        }
    }
}